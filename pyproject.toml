[project]
name = "hireme"
version = "0.1.0"
description = "An agentic job application assistant."
readme = "README.md"
authors = [
    { name = "Lime", email = "66lime7@protonmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.49.0",
    "pydantic>=2.12.5",
    "pydantic-ai-slim[logfire,mistral,openai]>=1.44.0",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.6.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "rendercv[full]>=2.6",
    "rich>=14.2.0",
    "sqlalchemy>=2.0.46",
    "structlog>=25.5.0",
    "typer>=0.21.1",
]

[project.scripts]
hireme = "hireme.cli.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.13.0",
    "ty>=0.0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/hireme"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
